    <div class="nav-wrap"><nav class="nav" id="nav" aria-label="Menu principal"></nav></div>
    <div class="sidebar-foot">
      <button class="usr" data-act="menuUsuario" aria-label="Minha conta">

  <div class="main">

      <button class="icon-btn only-mobile" data-act="toggleNav" aria-label="Abrir menu"><svg class="ic"><use href="#i-menu"/></svg></button>

        <h1 id="pgTitle">Visão Geral</h1>
        <p id="pgSub">Carregando…</p>
      </div>
      <div class="topbar-actions">
        <div class="search-wrap" id="buscaWrap">
          <svg class="ic"><use href="#i-busca"/></svg>
          <input type="search" id="globalSearch" placeholder="Buscar lead, cliente, orçamento…" aria-label="Busca global" autocomplete="off">
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
        <button class="nuvem-status" id="nuvemStatus" data-act="statusNuvem" hidden aria-label="Situação da nuvem"></button>
        <button class="icon-btn" data-act="alertas" aria-label="Alertas e pendências" id="btnAlertas"><svg class="ic"><use href="#i-sino"/></svg><span class="dot" id="alertDot" hidden></span></button>
        <button class="btn btn-primary" id="btnNovoLead" data-act="novoLead"><svg class="ic"><use href="#i-plus"/></svg><span class="hide-sm">Novo lead</span></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
