<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiscinaPro — Gestão & Vendas</title>
  <meta name="description" content="CRM de vendas e pós-venda de piscinas: funil, orçamentos, obras e financeiro.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e343d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PiscinaPro">
  <!-- aplica o tema salvo antes de pintar (evita "piscar") -->
  <script src="js/tema-inicial.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Menu principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 17c1.6 0 1.6 1.2 3.2 1.2S6.8 17 8.4 17s1.6 1.2 3.2 1.2S13.2 17 14.8 17s1.6 1.2 3.2 1.2S19.6 17 22 17" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M2 12.5c1.6 0 1.6 1.2 3.2 1.2s1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2 1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2S20.4 12.5 22 12.5" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8 9V5.5A1.5 1.5 0 0 1 9.5 4M15 9V5.5A1.5 1.5 0 0 0 13.5 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Piscina<b>Pro</b></div>
          <div class="brand-sub">Gestão &amp; Vendas</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-label">Comercial</div>
        <button class="nav-item active" type="button" data-view="dashboard" title="Visão Geral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Visão Geral</span>
        </button>
        <button class="nav-item" type="button" data-view="funil" title="Leads &amp; Funil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z" stroke-linejoin="round"/></svg>
          <span>Leads &amp; Funil</span>
          <b class="count-pill" id="nav-count">0</b>
        </button>
        <button class="nav-item" type="button" data-view="lista" title="Base de Leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-linecap="round"/></svg>
          <span>Base de Leads</span>
        </button>
        <button class="nav-item" type="button" data-view="orcamentos" title="Orçamentos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/><path d="M14 3v5h5M9 13h6M9 17h4" stroke-linecap="round"/></svg>
          <span>Orçamentos</span>
        </button>

        <div class="nav-label">Pós-venda</div>
        <button class="nav-item" type="button" data-view="clientes" title="Clientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M18 19a5 5 0 0 0-2.5-4.3" stroke-linecap="round"/></svg>
          <span>Clientes</span>
        </button>
        <button class="nav-item" type="button" data-view="obras" title="Obras &amp; Instalação">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Obras &amp; Instalação</span>
        </button>
        <button class="nav-item" type="button" data-view="financeiro" title="Financeiro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5h4a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3h4" stroke-linecap="round"/></svg>
          <span>Financeiro</span>
        </button>

        <div class="nav-label">Gestão</div>
        <button class="nav-item" type="button" data-view="relatorios" title="Relatórios &amp; Metas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 3v18h18M7 14l3-3 3 3 5-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Relatórios &amp; Metas</span>
        </button>
        <button class="nav-item" type="button" data-view="usuarios" title="Usuários" id="navUsuarios" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0" stroke-linecap="round"/><path d="M18.5 4.5l1.2 1.2 2.3-2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Usuários</span>
        </button>
        <button class="nav-item" type="button" data-view="configuracoes" title="Configurações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" stroke-linejoin="round"/></svg>
          <span>Configurações</span>
        </button>
      </nav>

      <div class="side-user">
        <div class="avatar" style="background:var(--water-600)" aria-hidden="true">PP</div>
        <div>
          <div class="nm">PiscinaPro</div>
          <div class="rl">Modo local</div>
        </div>
        <button class="side-logout" type="button" data-click="App.logout" title="Sair" aria-label="Sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="pageTitle">Visão Geral</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar cliente, telefone, modelo…" aria-label="Buscar">
        </div>
        <button class="icon-btn" id="themeToggle" type="button" data-click="App.toggleTheme" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"></button>
        <button class="icon-btn" type="button" title="Notificações" aria-label="Notificações">
          <span class="dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-primary" type="button" data-click="App.openNovoLead">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          <span class="btn-label">Novo Lead</span>
        </button>
      </header>
      <main class="content">
        <section class="view no-pad" id="view" tabindex="-1"></section>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay" data-click="App.closeAll"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Painel de detalhes"></aside>
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <noscript><p style="padding:24px">O PiscinaPro precisa de JavaScript habilitado.</p></noscript>

  <!-- ordem importa: scripts clássicos compartilham constantes globais -->
  <script src="vendor/supabase.js"></script>
  <script src="js/pure.js"></script>
  <script src="js/sync-diff.js"></script>
  <script src="js/proposta-html.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/acoes.js"></script>
  <script src="js/telas/painel.js"></script>
  <script src="js/telas/leads.js"></script>
  <script src="js/telas/clientes.js"></script>
  <script src="js/telas/obras.js"></script>
  <script src="js/telas/financeiro.js"></script>
  <script src="js/telas/relatorios.js"></script>
  <script src="js/telas/configuracoes.js"></script>
  <script src="js/telas/usuarios.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/orcamentos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
</body>
</html>
