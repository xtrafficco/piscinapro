<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PiscinaPro — Gestão & Vendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e343d" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PiscinaPro" />
  <script>try { var t = localStorage.getItem('piscinapro_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" title="PiscinaPro">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 17c1.6 0 1.6 1.2 3.2 1.2S6.8 17 8.4 17s1.6 1.2 3.2 1.2S13.2 17 14.8 17s1.6 1.2 3.2 1.2S19.6 17 22 17" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M2 12.5c1.6 0 1.6 1.2 3.2 1.2s1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2 1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2S20.4 12.5 22 12.5" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8 9V5.5A1.5 1.5 0 0 1 9.5 4M15 9V5.5A1.5 1.5 0 0 0 13.5 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Piscina<b>Pro</b></div>
          <div class="brand-sub">Gestão &amp; Vendas</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Visão Geral</span>
        </button>
        <div class="nav-label">Comercial</div>
        <button class="nav-item" data-view="funil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 4h18M6 8h12M9 12h6M10.5 16h3M11 20h2" stroke-linecap="round"/></svg>
          <span>Leads &amp; Funil</span><span class="count-pill" id="nav-count">0</span>
        </button>
        <button class="nav-item" data-view="lista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11" stroke-linecap="round"/></svg>
          <span>Base de Leads</span>
        </button>
        <button class="nav-item" data-view="orcamentos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-3" stroke-linecap="round"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 12h8M8 16h5" stroke-linecap="round"/></svg>
          <span>Orçamentos</span>
        </button>

        <div class="nav-label">Operação</div>
        <button class="nav-item" data-view="clientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M18 19a5 5 0 0 0-2.5-4.2" stroke-linecap="round"/></svg>
          <span>Clientes</span>
        </button>
        <button class="nav-item" data-view="obras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Obras &amp; Instalação</span>
        </button>
        <button class="nav-item" data-view="financeiro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h3" stroke-linecap="round"/></svg>
          <span>Financeiro</span>
        </button>

        <div class="nav-label">Gestão</div>
        <button class="nav-item" data-view="relatorios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/></svg>
          <span>Relatórios</span>
        </button>
        <button class="nav-item" data-view="configuracoes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/></svg>
          <span>Configurações</span>
        </button>
      </nav>

      <div class="side-user">
        <div class="avatar" style="background:linear-gradient(150deg,#c9a86a,#a8823f)">RA</div>
        <div>
          <div class="nm">Ramon Farias</div>
          <div class="rl">Gestor comercial</div>
        </div>
        <button class="side-logout" title="Sair / trocar de usuário" aria-label="Sair" onclick="App.logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 12H4M11 8l-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <div>
          <div class="page-title" id="pageTitle">Visão Geral</div>
          <div class="page-sub" id="pageSub">O panorama do negócio e as metas do time num só lugar</div>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar cliente, telefone, modelo…" />
        </div>
        <button class="icon-btn" id="themeToggle" title="Alternar tema claro/escuro" aria-label="Alternar tema" onclick="App.toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" title="Notificações" aria-label="Notificações"><span class="dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-primary" onclick="App.openNovoLead()" aria-label="Novo Lead">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          <span class="btn-label">Novo Lead</span>
        </button>
      </header>

      <div class="content">
        <section class="view no-pad" id="view"></section>
      </div>
    </div>
  </div>

  <!-- Overlays -->
  <div class="overlay" id="overlay" aria-hidden="true" onclick="App.closeAll()"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela" tabindex="-1"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Painel de detalhes" tabindex="-1"></aside>
  <div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

  <script src="pure.js"></script>
  <script src="app.js"></script>
  <script src="orcamentos.js"></script>
  <script src="supabase.js"></script>
  <script>
    // Registra o service worker (PWA instalável + offline). Só em http/https.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
