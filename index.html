<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiscinaPro — Gestão & Vendas</title>
  <meta name="description" content="CRM e ERP para empresas de piscinas: funil de vendas, propostas com assinatura, obras e financeiro completo.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-v2.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e343d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PiscinaPro">
  <!-- aplica o tema antes de pintar (evita "piscar") -->
  <script src="src/tema-inicial.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>
  <div class="app">
    <aside class="sidebar" aria-label="Menu principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 17c1.6 0 1.6 1.2 3.2 1.2S6.8 17 8.4 17s1.6 1.2 3.2 1.2S13.2 17 14.8 17s1.6 1.2 3.2 1.2S19.6 17 22 17" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M2 12.5c1.6 0 1.6 1.2 3.2 1.2s1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2 1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2S20.4 12.5 22 12.5" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8 9V5.5A1.5 1.5 0 0 1 9.5 4M15 9V5.5A1.5 1.5 0 0 0 13.5 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Piscina<b>Pro</b></div>
          <div class="brand-sub">Gestão &amp; Vendas</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" data-action="ui.menu" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
        </button>
        <div class="page-head">
          <h1 class="page-title" id="pageTitle">PiscinaPro</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="search" id="buscaWrap" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar cliente, telefone, modelo…" aria-label="Buscar">
        </div>
        <button class="icon-btn" id="themeToggle" type="button" data-action="ui.tema" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"></button>
        <button class="icon-btn" id="btnSino" type="button" data-action="sino.abrir" title="Tarefas e avisos" aria-label="Tarefas e avisos" aria-expanded="false">
          <span class="dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-primary" id="btnNovoLead" type="button" data-action="topo.novoLead" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          <span class="btn-label">Novo Lead</span>
        </button>
      </header>
      <main class="content">
        <section class="view no-pad" id="view" tabindex="-1"></section>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true" data-action="ui.fechar"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela" tabindex="-1"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Painel de detalhes" tabindex="-1"></aside>
  <div class="toast-wrap" id="toastWrap"></div>
  <noscript><p class="noscript">O PiscinaPro precisa de JavaScript habilitado.</p></noscript>

  <script src="vendor/supabase.umd.js" defer></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
